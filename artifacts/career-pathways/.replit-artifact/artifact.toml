kind = "web"
previewPath = "/"
title = "PivotPath AI"
description = "An AI-powered career intelligence and future-readiness platform. The current demo uses deterministic skill matching and simulated profile mapping, not model inference."
version = "1.0.0"
id = "artifacts/career-pathways"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24958

[services.development]
run = "pnpm --filter @workspace/career-pathways run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/career-pathways", "run", "build" ]
serve = "static"
publicDir = "artifacts/career-pathways/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24958"
BASE_PATH = "/"
